<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eendrag — Male Residence</title>
  <style>
    *,
    ::after,
    ::before {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --ink: #05070A;
      --bone: #E8E6DE;
      --slate: #8C95A6;
      --brass: #C9A227;
      --display: Georgia, 'Times New Roman', serif;
      --label: Arial, Helvetica, sans-serif
    }

    body,
    html {
      height: 100%
    }

    body {
      background: var(--ink);
      color: var(--bone);
      font-family: var(--label);
      min-height: 100vh;
      overflow-x: hidden
    }

    ::-webkit-scrollbar {
      width: 3px
    }

    ::-webkit-scrollbar-thumb {
      background: #1e1e1e;
      border-radius: 2px
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes fadeInSoft {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at 50% 38%, rgba(5, 7, 10, .10) 0, rgba(5, 7, 10, .48) 62%, rgba(5, 7, 10, .68) 100%)
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 34px 44px;
      opacity: 0;
      animation: fadeInSoft 1s ease .1s forwards
    }

    .brand {
      font-family: var(--display);
      letter-spacing: 4px;
      font-size: 20px;
      font-weight: 400;
      text-align: center;
      flex: 1
    }

    .brand .sub {
      display: block;
      font-family: var(--label);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--slate);
      margin-top: 4px
    }

    .topbar-side {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--bone);
      min-width: 90px
    }

    .topbar-side.right {
      justify-content: flex-end
    }

    .topbar-side a {
      color: inherit;
      text-decoration: none;
      cursor: pointer
    }

    .topbar-side a:hover {
      color: var(--brass)
    }

    .side-label {
      position: absolute;
      top: 50%;
      z-index: 2;
      transform: translateY(-50%) rotate(180deg);
      writing-mode: vertical-rl;
      font-size: 12px;
      letter-spacing: 5px;
      color: var(--slate);
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0;
      animation: fadeInSoft 1s ease .4s forwards
    }

    .side-label.left {
      left: 30px;
      font-family: var(--label)
    }

    .side-label.right {
      right: 30px;
      transform: translateY(-50%) rotate(0);
      font-family: var(--display);
      color: var(--brass);
      letter-spacing: 8px;
      font-size: 15px
    }

    .side-label::before {
      content: '';
      width: 1px;
      height: 40px;
      background: currentColor;
      opacity: .5
    }

    .side-label.left::before {
      order: 2
    }

    .hero-center {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 24px;
      gap: 30px
    }

    .thesis {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(24px, 3.6vw, 40px);
      line-height: 1.4;
      letter-spacing: .5px;
      max-width: 720px;
      opacity: 0;
      animation: fadeIn 1s ease .5s forwards
    }

    .thesis-rule {
      width: 46px;
      height: 1px;
      background: var(--brass);
      opacity: 0;
      animation: fadeIn 1s ease .7s forwards
    }

    .thesis-attrib {
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--slate);
      font-style: italic;
      opacity: 0;
      animation: fadeIn 1s ease .8s forwards
    }

    .motto-triangle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 4px;
      opacity: 0;
      animation: fadeIn 1s ease .9s forwards
    }

    .motto-apex {
      font-family: var(--display);
      font-style: italic;
      font-size: 15px;
      letter-spacing: 1px;
      color: var(--brass)
    }

    .motto-base {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 560px;
      gap: 48px
    }

    .motto-base span {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--slate);
      white-space: nowrap
    }

    .motto-base .left {
      text-align: left
    }

    .motto-base .right {
      text-align: right
    }

    @media (max-width:640px) {
      .motto-base {
        flex-direction: column;
        gap: 10px;
        max-width: 280px
      }

      .motto-base .left,
      .motto-base .right {
        text-align: center
      }
    }

    .bottombar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 44px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--slate);
      opacity: 0;
      animation: fadeInSoft 1s ease .6s forwards
    }

    .bottombar a {
      color: var(--slate);
      text-decoration: none;
      cursor: pointer
    }

    .bottombar a:hover {
      color: var(--brass)
    }

    .bottombar-links {
      display: flex;
      gap: 28px
    }

    @media (max-width:640px) {
      .side-label {
        display: none
      }

      .topbar {
        padding: 24px 22px
      }

      .bottombar {
        padding: 22px 22px;
        flex-direction: column;
        gap: 10px;
        text-align: center
      }

      .bottombar-links {
        gap: 18px
      }
    }
  </style>
</head>

<body>
  <div class="hero">
    <div class="hero-bg"><img src="hero.jpg" alt="" loading="eager" /></div>
    <div class="hero-scrim"></div>

    <div class="topbar">
      <div class="topbar-side left"></div>
      <div class="brand">EENDRAG <span class="sub">Stellenbosch University</span></div>
      <div class="topbar-side right"><a href="#contact">CONTACT</a></div>
    </div>

    <div class="side-label left">EST. 1961</div>
    <div class="side-label right">AVDH</div>

    <div class="hero-center">

      <div class="thesis">Eendrag Male Residence.</div>
      <div class="thesis-rule"></div>
      <div class="thesis-attrib">Alles Vir Die Huis</div>
      <div class="motto-triangle">
        <div class="motto-base">
          <span class="left">Character &middot; Style &middot; Pride</span>
          <span class="right">Isimbo &middot; Isimilo &middot; Ibhongo</span>
        </div>
        <div class="motto-apex">Karakter &middot; Styl &middot; Trots</div>
      </div>
        </div>
      </div>
    </div>

    <div class="bottombar" id="contact">
      <span>© Eendrag Male Residence</span>
      <div class="bottombar-links">
        <a href="mailto:info@eendrag.co.za">Enquire</a>
        <a href="#" onclick="return false">Instagram</a>
      </div>
    </div>
  </div>
</body>

</html>
